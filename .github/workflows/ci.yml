name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,serve]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: dbt parse (compiles every model and test)
        run: cd dbt && dbt parse --profiles-dir .
        env:
          SMARTSHOP_WAREHOUSE: /tmp/ci.duckdb
      # pytest builds a synthetic warehouse and runs the full dbt build + tests and the
      # point-in-time check on it. Real-data tests skip (raw data is not committed).
      - run: pytest -q

  docker:
    # Build the serving image, start it on a synthetic bundle, and smoke-test the live API.
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # same pinned scikit-learn as the image, so the bundle loads inside the container
      - run: pip install -r docker/requirements-serve.txt lightgbm duckdb && pip install --no-deps -e .
      - run: python -m smartshop.serving.demo_bundle --out artifacts && chmod -R a+rX artifacts
      - run: docker build -t smartshop-api .
      - run: docker run -d --name api -p 8000:8000 -v "$PWD/artifacts:/app/artifacts:ro" smartshop-api
      - run: python -m smartshop.serving.smoke --url http://localhost:8000 --wait 90
      - name: container health
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' api)
            [ "$s" = healthy ] && exit 0; sleep 2
          done
          docker logs api; exit 1
