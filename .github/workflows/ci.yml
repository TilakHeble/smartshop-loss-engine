name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: dbt parse (compiles every model and test)
        run: cd dbt && dbt parse --profiles-dir .
        env:
          SMARTSHOP_WAREHOUSE: /tmp/ci.duckdb
      # pytest builds a synthetic warehouse and runs the full dbt build + tests and the
      # point-in-time check on it. Real-data tests skip (raw data is not committed).
      - run: pytest -q
